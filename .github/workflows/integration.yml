name: Integration Tests (threads)

env:
  COLUMNS: 120

on:
  push:
    paths:
      - 'radssh/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'docs/**'
  workflow_dispatch:

jobs:
  integration:
    name: Integration subset (start_threads)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install test extras if any; fall back to installing requirements
          pip install -e .[test] || pip install -e .
      - name: Run integration tests with threads enabled
        env:
          RADSSH_TEST_INTEGRATION: "1"
        run: |
          pytest tests/test_cluster_utils.py tests/test_star_commands.py -q

  full-integration:
    name: Full integration
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test] || pip install -e .
      - name: Run full test suite (may be slow)
        # Keep a reasonable timeout for CI runners; this job runs nightly or on manual dispatch
        run: |
          pytest -q
        timeout-minutes: 60
