name: CI

on:
  push:
    branches: [ main, hwip ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install build
          pip install .[dev]
      - name: Lint (ruff)
        run: |
          python -m ruff check .
      - name: Run tests
        run: |
          pytest -q
